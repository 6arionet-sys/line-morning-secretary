name: Morning Secretary Bot

on:
  schedule:
    # 毎朝 5:30 JST (UTC 20:30) に実行
    - cron: '30 20 * * *'
  workflow_dispatch: # GitHub画面から手動テスト実行可能

permissions:
  contents: write

jobs:
  morning_notification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Morning Secretary
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/send.py

      - name: Commit and push last_run.txt (Keep-alive for 60-day rule)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_run.txt
          if git diff --staged --quiet; then
            echo "No changes in last_run.txt"
          else
            git commit -m "Auto: Update last_run.txt [skip ci]"
            git push
          fi
